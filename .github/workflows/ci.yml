name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: support-engine-ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build receiver, simulator, and test images
        run: docker compose --profile tools --profile test build
      - name: Check Python code and formatting
        run: |
          docker compose run --rm --no-deps test ruff check src tests
          docker compose run --rm --no-deps test ruff format --check src tests
      - name: Test the receiver and simulator
        run: docker compose run --rm test pytest -q
      - name: Show service state and logs after a failure
        if: failure()
        run: |
          docker compose ps --all
          docker compose logs --no-color --tail=150
      - name: Stop CI containers and remove CI volumes
        if: always()
        run: docker compose down --volumes --remove-orphans
