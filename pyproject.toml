[project]
name = "customer-support-engine"
version = "0.1.0"
description = "Event-driven support engine with durable run history and Redis Pub/Sub updates"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.6,<3",
  "redis>=6,<8",
  "rq>=2.5,<3",
  "sqlalchemy>=2.0,<2.1",
  "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = ["pytest>=8.3,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1"]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/support_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
cache_dir = "/tmp/support-engine-pytest-cache"
asyncio_mode = "auto"
markers = ["integration: needs the Compose PostgreSQL, Redis, API, and worker"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
