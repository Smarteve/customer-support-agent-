[project]
name = "customer-support-engine"
version = "0.1.0"
description = "Event simulator and first webhook receiver for a customer support learning project"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.6,<3",
  "uvicorn>=0.34,<1",
  "httpx>=0.28,<1",
  "httpx-sse>=0.4,<0.5",
  "python-dotenv>=1.0,<2",
]

[dependency-groups]
dev = ["pytest>=8.3,<10", "ruff>=0.11,<1"]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/support_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
cache_dir = "/tmp/support-engine-pytest-cache"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
