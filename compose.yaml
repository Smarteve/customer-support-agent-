name: support-engine

services:
  explorer:
    image: nginx:1.28-alpine
    volumes:
      - ./visualization/dist:/usr/share/nginx/html:ro
    ports:
      - '127.0.0.1:${EXPLORER_PORT:-8081}:80'
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1/]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  simulator:
    image: customer-support-simulator:dev
    build:
      context: .
      target: runtime
    profiles: [tools]
    environment:
      API_BASE_URL: ${SIMULATOR_API_BASE_URL:-http://host.docker.internal:8080}
      WEBHOOK_KEY_ID: ${WEBHOOK_KEY_ID:-demo}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-local-webhook-secret-change-me}
      OPERATOR_TOKEN: ${OPERATOR_TOKEN:-local-operator-token-change-me}
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    init: true

  test:
    image: customer-support-simulator:test
    build:
      context: .
      target: test
    profiles: [test]
    environment:
      RUFF_CACHE_DIR: /tmp/ruff
    init: true
