name: support-engine

services:
  redis:
    image: redis:7.4-alpine
    command: [redis-server, --appendonly, 'yes']
    volumes:
      - queue-data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: support
      POSTGRES_USER: support
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-support_dev}
    volumes:
      - event-store-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U support -d support']
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  migrate:
    image: customer-support-simulator:dev
    build:
      context: .
      target: runtime
    command: [alembic, upgrade, head]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://support:support_dev@postgres:5432/support}
    depends_on:
      postgres:
        condition: service_healthy

  api:
    image: customer-support-simulator:dev
    build:
      context: .
      target: runtime
    command: [uvicorn, support_engine.api:app, --host, 0.0.0.0, --port, '8080']
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://support:support_dev@postgres:5432/support}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      RQ_QUEUE: ${RQ_QUEUE:-support}
      WEBHOOK_KEY_ID: ${WEBHOOK_KEY_ID:-demo}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-local-webhook-secret-change-me}
      OPERATOR_TOKEN: ${OPERATOR_TOKEN:-local-operator-token-change-me}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    ports:
      - '127.0.0.1:${API_PORT:-8080}:8080'
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/openapi.json')"]
      interval: 2s
      timeout: 3s
      retries: 15
    init: true

  worker:
    image: customer-support-simulator:dev
    build:
      context: .
      target: runtime
    command: [python, -m, support_engine.worker]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://support:support_dev@postgres:5432/support}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      RQ_QUEUE: ${RQ_QUEUE:-support}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    init: true
    stop_grace_period: 100s
    restart: unless-stopped

  explorer:
    image: nginx:1.28-alpine
    volumes:
      - ./visualization/dist:/usr/share/nginx/html:ro
    ports:
      - '127.0.0.1:${EXPLORER_PORT:-8081}:80'
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1/]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  simulator:
    image: customer-support-simulator:dev
    build:
      context: .
      target: runtime
    profiles: [tools]
    environment:
      API_BASE_URL: ${SIMULATOR_API_BASE_URL:-http://api:8080}
      WEBHOOK_KEY_ID: ${WEBHOOK_KEY_ID:-demo}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-local-webhook-secret-change-me}
      OPERATOR_TOKEN: ${OPERATOR_TOKEN:-local-operator-token-change-me}
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    init: true

  test:
    image: customer-support-simulator:test
    build:
      context: .
      target: test
    profiles: [test]
    environment:
      RUFF_CACHE_DIR: /tmp/ruff
      TEST_REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      TEST_DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://support:support_dev@postgres:5432/support}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    init: true

volumes:
  event-store-data:
  queue-data:
